function bispoint(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2]}function circum(a,b,c){let D=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(!D)return [0,0];let A=dot(a,a),B=dot(b,b),C=dot(c,c);return [(A*(b[1]-c[1])+B*(c[1]-a[1])+C*(a[1]-b[1]))/D,(A*(c[0]-b[0])+B*(a[0]-c[0])+C*(b[0]-a[0]))/D]}

function arcContains(c,p){if(c.kind==='circle'||Math.abs(c.sweep)>=Math.PI*2-.1)return true;let t=Math.atan2(p[1]-c.c[1],p[0]-c.c[0]),delta=(t-c.start+Math.PI*8)%(Math.PI*2);return c.sweep>=0?delta<=c.sweep+.05:(Math.PI*2-delta)<=-c.sweep+.05}
function circCirc(a,b){let R=a.r,r=b.r,D=d(a.c,b.c);if(D<1e-8||D>R+r||D<Math.abs(R-r))return [];let t=(R*R-r*r+D*D)/(2*D),h=Math.sqrt(Math.max(0,R*R-t*t)),ux=(b.c[0]-a.c[0])/D,uy=(b.c[1]-a.c[1])/D,p=[a.c[0]+t*ux,a.c[1]+t*uy];return [[p[0]+h*-uy,p[1]+h*ux],[p[0]-h*-uy,p[1]-h*ux]].filter(pt=>arcContains(a,pt)&&arcContains(b,pt))}
function givens(){let t=L[idx],p=t.p;if(['tangent','twoTangents'].includes(t.type))return [{kind:'circle',c:p[0],r:d(p[0],p[1]),start:0,sweep:Math.PI*2}];if(p.length===3&&t.type!=='twoTangents')return [[0,1],[1,2],[2,0]].map(([a,b])=>({kind:'segment',a:p[a],b:p[b]}));if(['mid','bis'].includes(t.type))return [{kind:'segment',a:p[0],b:p[1]}];return []}
