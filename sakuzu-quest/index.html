  if(moved<7){let hit=nearest(p);if(hit&&d(hit,center)>8)radius=d(hit,center)}
  if(radius>=8){guide={c:center.slice(),r:radius};handleAngle=Math.atan2(p[1]-center[1],p[0]-center[0]);phase='draw';hint('③ オレンジのハンドルを回そう。円周から指が外れても大丈夫')}
  else hint('中心以外の点をタップするか、指をドラッグしてください');
  draw();return;
 }
 if(phase==='draw'){
  let sweep=totalSweep;
  if(Math.abs(sweep)<.10){strokeStart=null;strokeCurrent=null;hint('ハンドルを押さえたまま回してください');draw();return}
  let circle=Math.abs(sweep)>=Math.PI*1.94;
  shapes.push({kind:circle?'circle':'arc',c:center.slice(),r:radius,start:strokeStart,sweep:circle?Math.sign(sweep)*Math.PI*2:sweep});
  strokeStart=null;strokeCurrent=null;center=null;phase='center';
  hint('弧を描きました。点線は残ります。次の中心を選ぶか「判定」を押してください');
 }
 draw();
}
function setTool(t){tool=t;chosen=null;center=null;guide=null;down=null;phase='center';renderTools();hint('作図する点を選んでください');draw()}
function renderTools(){let bar=$('toolboxes');bar.replaceChildren();let tools=[['compass','コンパス','⚭'],['lock',locked?'半径固定を解除':'半径固定',locked?'🔒':'🔓'],['line','直線','line'],['segment','線分','segment']];let unlocked=new Set(['compass','line','segment']);for(let x of Object.values(progress))for(let name of x.skills||[])unlocked.add(name);if(course==='チュートリアル'){for(let i=0;i<stagePos;i++)if(L[COURSES[course][i]].skill)unlocked.add(L[COURSES[course][i]].skill)}[['point','点','●'],['bis','垂直二等分線','⊥'],['angle','角の二等分線','∠'],['perp','垂線','⊥']].forEach(x=>{if(unlocked.has(({point:'点',bis:'垂直二等分線',angle:'角の二等分線',perp:'垂線'})[x[0]]))tools.push(x)});for(let [id,title,txt] of tools){let b=document.createElement('button');b.className='tool-icon-btn';b.title=title;b.setAttribute('aria-label',title);b.setAttribute('aria-pressed',String(id===tool||id==='lock'&&locked));if(txt==='line'||txt==='segment')b.innerHTML=txt==='line'?'<svg viewBox="0 0 80 56"><path d="M4 49 L76 7" stroke="currentColor" stroke-width="4"/><circle cx="26" cy="36" r="6" fill="white" stroke="currentColor" stroke-width="3"/><circle cx="55" cy="19" r="6" fill="white" stroke="currentColor" stroke-width="3"/></svg>':'<svg viewBox="0 0 80 56"><path d="M15 45 L65 11" stroke="currentColor" stroke-width="4"/><circle cx="15" cy="45" r="6" fill="currentColor"/><circle cx="65" cy="11" r="6" fill="currentColor"/></svg>';else b.textContent=txt;b.onclick=()=>{if(id==='lock'){locked=!locked;renderTools();return}setTool(id)};bar.appendChild(b)}}
function lineNear(sh,p,t=13){if(sh.kind!=='line'&&sh.kind!=='segment')return false;let v=sub(sh.b,sh.a),w=sub(p,sh.a),l=norm(v);if(l<.001)return false;let k=dot(w,v)/(l*l);if(sh.kind==='segment'&&(k<-.02||k>1.02))return false;return Math.abs(cross(v,w)/l)<t}
function result(){let task=L[idx],p=task.p,ls=shapes.filter(s=>s.kind==='line'||s.kind==='segment'),circs=shapes.filter(s=>s.kind==='arc'||s.kind==='circle'),ca=(a,b)=>ls.some(s=>lineNear(s,a,12)&&lineNear(s,b,12)),circleAt=(o,r)=>circs.some(s=>near(s.c,o,16)&&Math.abs(s.r-r)<18&&Math.abs(s.sweep)>2);
const midpoint=bispoint(p[0],p[1]);const orth=(s,a,b)=>{let v=sub(b,a),w=sub(s.b,s.a);return Math.abs(dot(v,w))<norm(v)*norm(w)*.12};const bisok=ls.some(s=>lineNear(s,midpoint,16)&&orth(s,p[0],p[1]));const co=p.length===3?circum(...p):[0,0],ic=p.length===3?incenter(...p):[0,0];
if(task.type==='arc')return circs.some(s=>near(s.c,p[0],14)&&Math.abs(s.r-d(...p))<18);
if(task.type==='bis')return bisok;
if(task.type==='mid')return points.some(x=>!x.base&&near(x.p,midpoint,14))||bisok||shapes.some(s=>s.kind==='point'&&near(s.a,midpoint,14));
if(task.type==='ang'){let u=sub(p[1],p[0]),v=sub(p[2],p[0]),a=[u[0]/norm(u)+v[0]/norm(v),u[1]/norm(u)+v[1]/norm(v)];return ls.some(s=>lineNear(s,p[0],15)&&lineNear(s,[p[0][0]+a[0]*130,p[0][1]+a[1]*130],17))}
if(task.type==='circum')return ls.filter(s=>lineNear(s,co,16)).length>=2||points.some(x=>!x.base&&near(x.p,co,16))||circleAt(co,d(co,p[0]));
if(task.type==='circumcircle')return circleAt(co,d(co,p[0]))&&circs.some(s=>s.kind==='circle'||Math.abs(s.sweep)>5);
if(task.type==='incenter')return ls.filter(s=>lineNear(s,ic,16)).length>=2||points.some(x=>!x.base&&near(x.p,ic,16));
if(task.type==='incircle'){let side=sub(p[1],p[0]),r=Math.abs(cross(side,sub(ic,p[0])))/norm(side);return circleAt(ic,r)}
if(task.type==='perp'||task.type==='tangent'){let o=p[0],t=p[1];return ls.some(s=>lineNear(s,t,15)&&orth(s,o,t))}
return false}
function judge(){if(passed){next();return}let ok=result();$('result').classList.add('visible');$('feedback').textContent=ok?'正解！':'もう少し！ 作図を確認してください。';$('next').style.display=ok?'inline-block':'none';if(ok){passed=true;$('judge').textContent='次へ →';let old=progress[course]||{done:0,skills:[]};old.done=Math.max(old.done,stagePos+1);if(L[idx].skill&&!old.skills.includes(L[idx].skill))old.skills.push(L[idx].skill);progress[course]=old;try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}}
function next(){if(!passed)return;stagePos++;if(stagePos>=COURSES[course].length){home();return}stage()}
let stagePos=0;function start(c){course=c;stagePos=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');$('homeBtn').classList.remove('hidden');stage()}
function mascot(win){return '<svg class="face" viewBox="0 0 120 116" aria-hidden="true">'+(win?'<path d="M34 26 L27 5 L48 15 L60 0 L73 15 L94 5 L87 26 Z" fill="#f2ca52" stroke="#916b20" stroke-width="2"/>':'')+'<circle cx="60" cy="65" r="47" fill="white" stroke="#183d48" stroke-width="4"/><circle cx="44" cy="62" r="15" fill="none" stroke="#183d48" stroke-width="4"/><circle cx="78" cy="62" r="15" fill="none" stroke="#183d48" stroke-width="4"/><path d="M59 62Q61 58 63 62M53 82Q60 92 68 82" fill="none" stroke="#183d48" stroke-width="3"/></svg>'}
function home(){course='';$('home').classList.remove('hidden');$('game').classList.add('hidden');$('homeBtn').classList.add('hidden');$('courses').replaceChildren();for(let c of Object.keys(COURSES)){let val=progress[c],done=val?.done||0,won=done>=COURSES[c].length,b=document.createElement('button');b.className='course';b.innerHTML=mascot(won)+'<span>'+c+'</span><span class="status">'+done+' / '+COURSES[c].length+(won?'　クリア！':'')+'</span>';b.onclick=()=>start(c);$('courses').appendChild(b)}}
function undo(){if(chosen!==null){chosen=null}else if(strokeStart!==null){strokeStart=null;strokeCurrent=null}else if(center){center=null;guide=null;phase='center';radius=locked?radius:0}else{shapes.pop()}passed=false;$('result').classList.remove('visible');$('judge').textContent='判定';draw()}
$('board').addEventListener('pointerdown',onDown);$('board').addEventListener('pointermove',onMove);$('board').addEventListener('pointerup',onUp);$('board').addEventListener('pointercancel',()=>{down=null;strokeStart=null;strokeCurrent=null;draw()});$('homeBtn').onclick=home;$('undo').onclick=undo;$('reset').onclick=stage;$('judge').onclick=judge;$('next').onclick=next;try{home()}catch(e){$('startupError').classList.remove('hidden');console.error('起動エラー',e)}
</script></body></html>
