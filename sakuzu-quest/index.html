<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153e49"><title>作図クエスト</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#193746;font-family:system-ui,"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer;min-height:48px;border:2px solid #b9cbc8;border-radius:12px;background:white;color:#193746;touch-action:manipulation}button:focus-visible{outline:3px solid #f89e24}button[aria-pressed=true]{background:#087e70;color:#fff;border-color:#087e70}header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#183d48;color:white}header h1{font-size:21px;margin:0}header button{background:white;padding:4px 15px}.wrap{max-width:1050px;margin:auto;padding:12px}.hidden{display:none!important}.coursegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:650px;margin:12px auto}.course{aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;border-radius:18px;font-weight:800;font-size:clamp(15px,3.3vw,22px)}.face{width:55%;max-width:150px}.status{font-size:13px;color:#56716e}h2{font-size:clamp(18px,4vw,26px);margin:10px 0 12px}.progress{color:#52756e;font-weight:700}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.toolbar button{padding:8px 13px}.toolbar .judge{background:#ed790e;color:white;border-color:#bc5400;font-weight:800;margin-left:auto}.board{border:2px solid #c9d7d3;border-radius:14px;overflow:hidden;background:white}svg#board{width:100%;height:min(64dvh,570px);min-height:350px;display:block;touch-action:manipulation;background-color:white;background-image:linear-gradient(#eff2f1 1px,transparent 1px),linear-gradient(90deg,#eff2f1 1px,transparent 1px);background-size:32px 32px}.hint{font-size:14px;color:#486965;margin:8px 0}.result{border:2px solid #d8c693;background:#fff7e0;border-radius:12px;padding:15px;text-align:center;margin:10px 0;display:none}.result.visible{display:block}.result button{background:#ed790e;border-color:#bb5600;color:white;font-weight:800;padding:8px 30px}.pt{fill:white;stroke:#178a78;stroke-width:3;pointer-events:none}.pt-halo{fill:transparent;stroke:transparent;stroke-width:30;pointer-events:all}.label{font-size:22px;font-family:Georgia,serif;fill:#193746;pointer-events:none}@media(max-width:480px){.wrap{padding:8px}.toolbar button{padding:8px 11px;font-size:14px}.coursegrid{gap:9px}svg#board{height:61dvh;min-height:310px}}
</style></head><body><header><h1>作図クエスト</h1><button id="homeBtn" class="hidden">ホーム</button></header><main class="wrap"><section id="home"><h2 style="text-align:center">コースを選ぶ</h2><div class="coursegrid" id="courses"></div></section><section id="game" class="hidden"><div class="progress" id="progress"></div><h2 id="question"></h2><div class="toolbar"><button id="line" aria-pressed="true" title="直線：2点を通り両方向に延びる">◉──◉ 直線</button><button id="segment" aria-pressed="false" title="線分：2点の間を結ぶ">●━━● 線分</button><button id="undo">1回戻る</button><button id="reset">やり直す</button><button id="judge" class="judge">判定</button></div><div class="board"><svg id="board" viewBox="0 0 800 550" preserveAspectRatio="xMidYMid meet" aria-label="作図画面"></svg></div><p class="hint" id="hint">2点を順にタップしてください。</p><div class="result" id="result" aria-live="polite"><strong id="feedback"></strong><div style="margin-top:10px"><button id="next">次の問題へ →</button></div></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg',KEY='sakuzu_quest_web_trial_1';
const LESSONS={
'チュートリアル':[{q:'2点A，Bを通る直線を作図せよ',pts:[[210,240,'A'],[590,340,'B']],pair:[0,1]},{q:'線分ACを作図せよ',pts:[[170,170,'A'],[570,230,'B'],[370,425,'C']],pair:[0,2]}],
'初級編':[{q:'2点B，Cを通る直線を作図せよ',pts:[[215,170,'A'],[620,240,'B'],[350,430,'C']],pair:[1,2]},{q:'線分ABを作図せよ',pts:[[180,350,'A'],[600,120,'B']],pair:[0,1]}],
'中級編':[{q:'線分ACを作図せよ',pts:[[200,180,'A'],[610,160,'B'],[390,425,'C']],pair:[0,2]},{q:'2点A，Bを通る直線を作図せよ',pts:[[230,180,'A'],[570,395,'B']],pair:[0,1]}],
'上級編':[{q:'2点B，Cを通る直線を作図せよ',pts:[[180,165,'A'],[590,220,'B'],[375,435,'C']],pair:[1,2]},{q:'線分ABを作図せよ',pts:[[210,320,'A'],[600,210,'B']],pair:[0,1]}]};
let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let course='',index=0,tool='line',selection=null,lines=[],passed=false;
function el(tag,a={},p=$('board')){let n=document.createElementNS(ns,tag);for(let k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n}
function mascot(win){return '<svg class="face" viewBox="0 0 120 116" aria-hidden="true">'+(win?'<path d="M34 26 L27 5 L48 15 L60 0 L73 15 L94 5 L87 26 Z" fill="#f2ca52" stroke="#916b20" stroke-width="2"/>':'')+'<circle cx="60" cy="65" r="47" fill="white" stroke="#183d48" stroke-width="4"/><circle cx="44" cy="62" r="15" fill="none" stroke="#183d48" stroke-width="4"/><circle cx="78" cy="62" r="15" fill="none" stroke="#183d48" stroke-width="4"/><path d="M59 62Q61 58 63 62M53 82Q60 92 68 82" fill="none" stroke="#183d48" stroke-width="3" stroke-linecap="round"/></svg>'}
function home(){course='';$('home').classList.remove('hidden');$('game').classList.add('hidden');$('homeBtn').classList.add('hidden');$('courses').replaceChildren();Object.keys(LESSONS).forEach(c=>{let won=(progress[c]||0)>=LESSONS[c].length,b=document.createElement('button');b.className='course';b.innerHTML=mascot(won)+'<span>'+c+'</span><span class="status">'+(progress[c]||0)+' / '+LESSONS[c].length+(won?'　クリア！':'')+'</span>';b.addEventListener('click',()=>start(c));$('courses').appendChild(b)})}
function start(c){course=c;index=0;$('home').classList.add('hidden');$('game').classList.remove('hidden');$('homeBtn').classList.remove('hidden');setup()}
function setup(){selection=null;lines=[];passed=false;tool='line';$('line').setAttribute('aria-pressed','true');$('segment').setAttribute('aria-pressed','false');$('result').classList.remove('visible');$('judge').textContent='判定';$('question').textContent=LESSONS[course][index].q;$('progress').textContent=course+'　'+(index+1)+' / '+LESSONS[course].length;$('hint').textContent='2点を順にタップしてください。';render()}
function render(){let s=$('board');s.replaceChildren();lines.forEach(l=>{let p=LESSONS[course][index].pts,a=p[l.a],b=p[l.b],x1=a[0],y1=a[1],x2=b[0],y2=b[1];if(l.type==='line'){let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);x1-=dx/len*900;y1-=dy/len*900;x2+=dx/len*900;y2+=dy/len*900}el('line',{x1,y1,x2,y2,stroke:'#138575','stroke-width':4})});LESSONS[course][index].pts.forEach(([x,y,t],i)=>{let g=el('g',{'data-i':i});el('circle',{cx:x,cy:y,r:26,class:'pt-halo'},g);el('circle',{cx:x,cy:y,r:selection===i?9:6,class:'pt'},g);let label=el('text',{x:x+13,y:y-14,class:'label'},g);label.textContent=t;g.addEventListener('click',()=>pick(i))})}
function pick(i){if(passed)return;if(selection===null){selection=i;$('hint').textContent='もう1つの点をタップしてください。';render();return}if(selection!==i){lines.push({a:selection,b:i,type:tool});$('hint').textContent='作図できました。「判定」を押してください。'}selection=null;render()}
function setTool(t){tool=t;selection=null;$('line').setAttribute('aria-pressed',String(t==='line'));$('segment').setAttribute('aria-pressed',String(t==='segment'));$('hint').textContent=t==='line'?'2点を選ぶと直線を描きます。':'2点を選ぶと線分を描きます。';render()}
function undo(){if(selection!==null)selection=null;else lines.pop();$('result').classList.remove('visible');passed=false;$('judge').textContent='判定';render()}
function judge(){if(passed){next();return}let [a,b]=LESSONS[course][index].pair,ok=lines.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));$('result').classList.add('visible');$('feedback').textContent=ok?'正解！':'もう少し！ 目的の2点をつないでください。';$('next').style.display=ok?'inline-block':'none';if(ok){passed=true;progress[course]=Math.max(progress[course]||0,index+1);try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}$('judge').textContent='次へ →'}}
function next(){if(!passed)return;index++;if(index>=LESSONS[course].length){home();return}setup()}
$('homeBtn').onclick=home;$('line').onclick=()=>setTool('line');$('segment').onclick=()=>setTool('segment');$('undo').onclick=undo;$('reset').onclick=setup;$('judge').onclick=judge;$('next').onclick=next;home();
</script></body></html>
